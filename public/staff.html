<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Заказы — Phở Việt</title>
  <meta name="theme-color" content="#110909">
  <link rel="manifest" href="/staff.webmanifest">
  <link rel="icon" href="/icons/favicon-48.png" sizes="48x48">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Заказы PV">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/staff.css?v=1">
</head>
<body>
<!-- Раздел для персонала: владелец и менеджеры ресторанов. Данные — с сервера (/api/staff/…), работает при включённой базе заказов -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-truck" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></g></symbol>
    <symbol id="i-walk" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="4" r="2"/><path d="m9 21 2-6 3 3v3M7 12l3-4 4 1 2 4M10 8l-1 5"/></g></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M5 3h4l2 5-2.5 1.5a11 11 0 0 0 6 6L16 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 5a2 2 0 0 1 2-2z"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-12a7 7 0 0 1 14 0c0 5.8-7 12-7 12z"/><circle cx="12" cy="9" r="2.5"/></g></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4zM10 21h4"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/></g></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></g></symbol>
  </defs>
</svg>

<div class="boot" id="boot" aria-live="polite"><span class="spinner"></span></div>

<!-- Раздел выключен (сайт ещё на сервере без базы) или ошибка связи -->
<main class="notice" id="notice" hidden>
  <div class="notice-card">
    <img src="/icons/logo-176.png" alt="" width="64" height="62">
    <h1 id="noticeTitle">Раздел заказов</h1>
    <p id="noticeText"></p>
    <a class="btn ghost" href="/">На сайт</a>
  </div>
</main>

<!-- Вход -->
<main class="login" id="login" hidden>
  <form class="login-card" id="loginForm" novalidate>
    <img src="/icons/logo-176.png" alt="" width="64" height="62">
    <h1>Заказы Phở Việt</h1>
    <p class="muted">Вход для владельца и менеджеров ресторанов</p>
    <label class="field">Логин<input name="login" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label class="field">Пароль<input name="password" type="password" autocomplete="current-password" required></label>
    <p class="form-error" id="loginError" role="alert"></p>
    <button class="btn primary wide" type="submit">Войти</button>
  </form>
</main>

<!-- Приложение -->
<div class="app" id="app" hidden>
  <header class="top">
    <a class="brand" href="/staff" aria-label="Заказы Phở Việt"><img src="/icons/logo-176.png" alt="" width="34" height="33"><span>Заказы</span></a>
    <nav class="tabs" aria-label="Разделы">
      <button class="tab is-on" data-view="orders" type="button">Заказы <b class="badge" id="newBadge" hidden>0</b></button>
      <button class="tab" data-view="reports" type="button">Отчёты</button>
      <button class="tab" data-view="team" type="button" id="teamTab" hidden>Сотрудники</button>
    </nav>
    <div class="who">
      <span class="who-name" id="whoName"></span>
      <button class="btn ghost sm" id="logoutBtn" type="button">Выйти</button>
    </div>
  </header>

  <!-- Заказы -->
  <section class="view" id="viewOrders" aria-label="Заказы">
    <div class="toolbar">
      <div class="seg" role="tablist" aria-label="Какие заказы показать">
        <button class="seg-btn is-on" data-scope="active" role="tab" aria-selected="true" type="button">Активные</button>
        <button class="seg-btn" data-scope="done" role="tab" aria-selected="false" type="button">Выполненные</button>
        <button class="seg-btn" data-scope="cancelled" role="tab" aria-selected="false" type="button">Отменённые</button>
        <button class="seg-btn" data-scope="all" role="tab" aria-selected="false" type="button">Все</button>
      </div>
      <label class="date-pick" id="datePick" hidden><span class="sr-only">День</span><input type="date" id="dateInput"></label>
      <select class="select point-select" id="pointOrders" aria-label="Ресторан" hidden></select>
      <label class="search"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg><input type="search" id="searchInput" placeholder="№, телефон или имя" aria-label="Поиск заказа"></label>
      <div class="toggles">
        <button class="icon-btn" id="notifyBtn" type="button" aria-pressed="false" title="Уведомления о новых заказах"><svg class="ic"><use href="#i-bell"/></svg><span class="sr-only">Уведомления</span></button>
        <button class="icon-btn" id="wakeBtn" type="button" aria-pressed="false" title="Не гасить экран"><svg class="ic"><use href="#i-sun"/></svg><span class="sr-only">Не гасить экран</span></button>
      </div>
    </div>
    <div class="orders-layout">
      <div class="order-list" id="orderList" aria-live="polite"></div>
      <aside class="order-panel" id="orderPanel" aria-label="Заказ" hidden></aside>
    </div>
  </section>

  <!-- Отчёты -->
  <section class="view" id="viewReports" aria-label="Отчёты" hidden>
    <div class="toolbar">
      <div class="chips" id="periodChips" role="group" aria-label="Период">
        <button class="chip is-on" data-period="today" type="button">Сегодня</button>
        <button class="chip" data-period="yesterday" type="button">Вчера</button>
        <button class="chip" data-period="7" type="button">7 дней</button>
        <button class="chip" data-period="30" type="button">30 дней</button>
        <button class="chip" data-period="month" type="button">Этот месяц</button>
        <button class="chip" data-period="prevmonth" type="button">Прошлый месяц</button>
      </div>
      <div class="range">
        <label><span class="sr-only">С</span><input type="date" id="fromInput"></label>
        <span aria-hidden="true">—</span>
        <label><span class="sr-only">По</span><input type="date" id="toInput"></label>
      </div>
      <select class="select point-select" id="pointReports" aria-label="Ресторан" hidden></select>
      <a class="btn ghost sm" id="exportBtn" href="#" download><svg class="ic"><use href="#i-download"/></svg>Excel</a>
    </div>
    <div class="report" id="report"></div>
  </section>

  <!-- Сотрудники (владелец) -->
  <section class="view" id="viewTeam" aria-label="Сотрудники" hidden>
    <div class="team-grid">
      <div class="card">
        <h2>Сотрудники</h2>
        <div class="team-list" id="teamList"></div>
      </div>
      <form class="card" id="addForm" novalidate>
        <h2>Добавить сотрудника</h2>
        <label class="field">Имя<input name="name" required placeholder="Анна, менеджер"></label>
        <label class="field">Логин<input name="login" required autocapitalize="none" spellcheck="false" placeholder="anna.p1"></label>
        <label class="field">Роль
          <select name="role" class="select"><option value="manager">Менеджер ресторана</option><option value="owner">Владелец (видит всё)</option></select>
        </label>
        <label class="field" id="addPointField">Ресторан<select name="point" class="select" id="addPoint"></select></label>
        <p class="form-error" id="addError" role="alert"></p>
        <button class="btn primary wide" type="submit">Добавить</button>
        <p class="hint">Пароль появится один раз — передайте его сотруднику лично.</p>
      </form>
    </div>
  </section>
</div>

<!-- Отмена заказа -->
<dialog class="dialog" id="cancelDialog">
  <form method="dialog" id="cancelForm">
    <h2>Отменить заказ <span id="cancelNum"></span>?</h2>
    <p class="muted">Причина попадёт в отчёт.</p>
    <div class="reasons" id="reasons"></div>
    <label class="field">Своя причина<input name="reason" id="cancelReason" maxlength="200" placeholder="Например: гость перенёс заказ"></label>
    <p class="form-error" id="cancelError" role="alert"></p>
    <div class="dialog-actions">
      <button class="btn ghost" value="close" type="submit" formnovalidate>Не отменять</button>
      <button class="btn danger" value="ok" type="submit" id="cancelOk">Отменить заказ</button>
    </div>
  </form>
</dialog>

<!-- Пароль сотрудника -->
<dialog class="dialog" id="passDialog">
  <form method="dialog">
    <h2 id="passTitle">Пароль</h2>
    <p class="muted" id="passText"></p>
    <div class="pass-box"><code id="passValue"></code><button class="btn ghost sm" type="button" id="passCopy">Скопировать</button></div>
    <div class="dialog-actions"><button class="btn primary" value="ok" type="submit">Готово</button></div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>
<script src="/staff.js?v=1"></script>
</body>
</html>
